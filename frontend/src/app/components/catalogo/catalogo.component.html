<app-navbar></app-navbar>

<div class="catalogo">
  <p class="subtitulo">✦ cuida tu piel, cuídate a ti ✦</p>

  @if (productos().length === 0) {
    <p>Cargando productos...</p>
  }

  <div class="productos-grid">
    @for (p of productos(); track p.id) {
      <app-product-card
        [producto]="p"
        (agregar)="agregar(p)">
      </app-product-card>
    }
  </div>
</div>
